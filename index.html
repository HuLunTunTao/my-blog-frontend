<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/peach.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>囫囵吞桃的个人博客</title>
    <meta
      name="description"
      content="囫囵吞桃的个人博客，记录计算机技术、学习笔记、项目实践与日常思考。"
    />
    <link rel="canonical" href="https://blog.hltt.online/" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var isDark =
            t === 'dark' ||
            ((!t || t === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
